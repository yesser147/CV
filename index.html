<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yasser Saidani — Software Engineering Portfolio</title>
  <meta name="description" content="Portfolio of Yasser Saidani, Software Engineering student — Full-Stack, AI and Data projects." />
  <meta property="og:title" content="Yasser Saidani — Software Engineering Portfolio" />
  <meta property="og:description" content="Full-Stack · AI · Data — projects, experience and certifications." />
  <meta property="og:image" content="assets/img/profile.jpg" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232563eb'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial' font-weight='700' font-size='28' fill='white'%3EYS%3C/text%3E%3C/svg%3E" />

  <!-- Apply saved / system theme before paint (avoids a flash) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <!-- ─────────── Navigation ─────────── -->
  <header class="nav" id="top">
    <div class="container nav-inner">
      <a href="#top" class="brand" data-render="brand"></a>
      <nav class="nav-links" id="nav-links">
        <a href="#about">About</a>
        <a href="#experience">Experience</a>
        <a href="#projects">Projects</a>
        <a href="#skills">Skills</a>
        <a href="#certifications">Certifications</a>
        <a href="#contact">Contact</a>
      </nav>
      <div class="nav-actions">
        <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode"></button>
        <button class="icon-btn menu-btn" id="menu-toggle" aria-label="Open menu" aria-expanded="false"></button>
      </div>
    </div>
  </header>

  <main>
    <!-- ─────────── Hero ─────────── -->
    <section class="hero">
      <div class="container hero-inner" data-render="hero"></div>
    </section>

    <!-- ─────────── About ─────────── -->
    <section class="section" id="about">
      <div class="container">
        <div class="section-head"><span class="eyebrow">01</span><h2>About me</h2></div>
        <div class="about-grid" data-render="about"></div>
      </div>
    </section>

    <!-- ─────────── Experience ─────────── -->
    <section class="section" id="experience">
      <div class="container">
        <div class="section-head"><span class="eyebrow">02</span><h2>Experience</h2></div>
        <div data-render="experience"></div>
      </div>
    </section>

    <!-- ─────────── Projects ─────────── -->
    <section class="section" id="projects">
      <div class="container">
        <div class="section-head"><span class="eyebrow">03</span><h2>Projects</h2></div>
        <div data-render="projects"></div>
      </div>
    </section>

    <!-- ─────────── Skills ─────────── -->
    <section class="section" id="skills">
      <div class="container">
        <div class="section-head"><span class="eyebrow">04</span><h2>Skills</h2></div>
        <div class="skills-grid" data-render="skills"></div>
      </div>
    </section>

    <!-- ─────────── Certifications ─────────── -->
    <section class="section" id="certifications">
      <div class="container">
        <div class="section-head"><span class="eyebrow">05</span><h2>Certifications</h2></div>
        <div class="cert-grid" data-render="certifications"></div>
      </div>
    </section>

    <!-- ─────────── Contact ─────────── -->
    <section class="section" id="contact">
      <div class="container" data-render="contact"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container"><div class="footer-inner" data-render="footer"></div></div>
  </footer>

  <noscript>
    <p style="padding:24px;text-align:center">
      This portfolio needs JavaScript. You can still download the
      <a href="assets/cv/CV_EN.pdf">CV (EN)</a> or <a href="assets/cv/CV_FR.pdf">CV (FR)</a>.
    </p>
  </noscript>

  <!-- Content first, then the script that renders it -->
  <script src="data/content.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
